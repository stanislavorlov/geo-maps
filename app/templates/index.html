<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Geo Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="search-panel">
        <div class="search-input-group">
            <div class="input-wrapper">
                <input type="text" id="from-input" placeholder="Choose starting point...">
                <button class="map-pick-btn active" data-target="from-input" title="Choose on map">📍</button>
            </div>
            <div class="input-wrapper">
                <input type="text" id="to-input" placeholder="Choose destination...">
                <button class="map-pick-btn" data-target="to-input" title="Choose on map">📍</button>
            </div>
        </div>
        <div class="route-type-group" role="radiogroup" aria-label="Route algorithm">
            <input type="radio" id="route-type-dijkstra" name="route-type" value="dijkstra" checked>
            <label for="route-type-dijkstra">Dijkstra</label>
            <input type="radio" id="route-type-astar" name="route-type" value="astar">
            <label for="route-type-astar">A* search</label>
        </div>
        <button id="find-route-btn" class="find-route-btn">Find Route</button>
    </div>
    <div id="map"></div>

    <script src="/static/js/main.js"></script>
</body>

</html>
