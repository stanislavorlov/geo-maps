<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Geo Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="search-panel">
        <div class="travel-mode-group" role="radiogroup" aria-label="Travel mode">
            <input type="radio" id="mode-driving" name="travel-mode" value="driving" checked>
            <label for="mode-driving" title="Driving">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 16.5V11l1.6-4.6A2 2 0 0 1 7.5 5h9a2 2 0 0 1 1.9 1.4L20 11v5.5" />
                    <path d="M4 16.5h16" />
                    <path d="M4 16.5v2.3a.7.7 0 0 0 .7.7h1.1a.7.7 0 0 0 .7-.7v-2.3" />
                    <path d="M17.5 16.5v2.3a.7.7 0 0 0 .7.7h1.1a.7.7 0 0 0 .7-.7v-2.3" />
                    <path d="M4 11h16" />
                    <circle cx="7.5" cy="13.7" r="1.1" />
                    <circle cx="16.5" cy="13.7" r="1.1" />
                </svg>
                <span>Driving</span>
            </label>

            <input type="radio" id="mode-walking" name="travel-mode" value="walking">
            <label for="mode-walking" title="Walking">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="13.5" cy="4.5" r="1.6" fill="currentColor" stroke="none" />
                    <path d="M11 8l2.2 2 .8 3 2.5 2.3" />
                    <path d="M13.2 10 10 12l-2 4.5" />
                    <path d="M14 13l-.3 3-3.2 4.5" />
                    <path d="M16 15.5l2.3 1.8" />
                </svg>
                <span>Walking</span>
            </label>

            <input type="radio" id="mode-cycling" name="travel-mode" value="cycling">
            <label for="mode-cycling" title="Cycling">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="6" cy="17" r="3" />
                    <circle cx="18" cy="17" r="3" />
                    <path d="M6 17l4-8h4" />
                    <path d="M10 9l3.5 8h4.5" />
                    <path d="M10 9h-1.2" />
                    <circle cx="15" cy="6" r="1.3" fill="currentColor" stroke="none" />
                </svg>
                <span>Cycling</span>
            </label>

            <input type="radio" id="mode-transit" name="travel-mode" value="transit">
            <label for="mode-transit" title="City transport">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="4" width="14" height="12.5" rx="3" />
                    <path d="M5 10.5h14" />
                    <path d="M8.2 13.6h.01" />
                    <path d="M15.8 13.6h.01" />
                    <path d="M8 19.5l-1.5 2" />
                    <path d="M16 19.5l1.5 2" />
                </svg>
                <span>Transit</span>
            </label>
        </div>
        <div class="search-input-group">
            <div class="input-wrapper">
                <input type="text" id="from-input" placeholder="Choose starting point...">
                <button class="map-pick-btn active" data-target="from-input" title="Choose on map">📍</button>
            </div>
            <div class="input-wrapper">
                <input type="text" id="to-input" placeholder="Choose destination...">
                <button class="map-pick-btn" data-target="to-input" title="Choose on map">📍</button>
            </div>
        </div>
        <div class="route-type-group" role="radiogroup" aria-label="Route algorithm">
            <input type="radio" id="route-type-dijkstra" name="route-type" value="dijkstra" checked>
            <label for="route-type-dijkstra">Dijkstra</label>
            <input type="radio" id="route-type-astar" name="route-type" value="astar">
            <label for="route-type-astar">A* search</label>
        </div>
        <button id="find-route-btn" class="find-route-btn">Find Route</button>
    </div>
    <div id="map"></div>

    <script src="/static/js/main.js"></script>
</body>

</html>
